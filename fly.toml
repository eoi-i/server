# fly.toml app configuration file generated for server-mariam on 2026-11-04T05:50:25Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'server-mariam'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-1x'
